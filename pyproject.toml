[project]
name = "photo-cull"
version = "0.1.0"
description = "MLX-powered pre-edit photo culling and star-rating tool for Fujifilm JPEG+RAF pairs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Heavy, macOS/Apple-Silicon-only ML backends. Kept optional so the core
# pipeline, tests, and CLI plumbing can be developed/tested without them.
mlx = [
    "mlx>=0.18",
    "mlx-vlm>=0.1.11",
]
embeddings = [
    "mlx-embeddings>=0.1.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
photo-cull = "photo_cull.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["photo_cull*"]
